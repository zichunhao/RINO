defaults:
  - shared/stream@train_set
  - shared/stream@val_set
  - shared/stream@test_set

_target_: src.datamodules.hdf_stream.StreamModule

# RINO kinematics HDF5 files (7 features per particle).
# Generated by: python scripts/make_jetclass.py --source_path PROJECT_ROOT/data/JetClass/raw/ --dest_path PROJECT_ROOT/data/JetClass/mpm-rino/
train_set:
  path: ${paths.root_dir}/../../data/JetClass/mpm-rino/train_100M_combined_QCD.h5
  csts_dim: ${csts_dim}
  features:
    - [csts, f, [128]]
    - [mask, bool, [128]]
    - [labels, l, null]
    - [jets, f, null]

val_set:
  path: ${paths.root_dir}/../../data/JetClass/mpm-rino/val_5M_combined_QCD.h5
  csts_dim: ${csts_dim}
  features:
    - [csts, f, [128]]
    - [mask, bool, [128]]
    - [labels, l, null]
    - [jets, f, null]

test_set:
  path: ${paths.root_dir}/../../data/JetClass/mpm-rino/test_20M_combined_QCD.h5
  csts_dim: ${csts_dim}
  features:
    - [csts, f, [128]]
    - [mask, bool, [128]]
    - [labels, l, null]
    - [jets, f, null]

num_workers: 1
batch_size: 500
pin_memory: True
# No quantile preprocessing — RINO features are already normalized
transforms: []
