defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

prefix: jetclass
suffix: frozen
path: PROJECT_ROOT/experiments/
plot_dir: PROJECT_ROOT/experiments/mpm/plots
force_recompute: false

models:
  reg: reg
  diff: diff
  flow: flow
  vae: vae
  kmeans: kmeans
  mdm: mdm
