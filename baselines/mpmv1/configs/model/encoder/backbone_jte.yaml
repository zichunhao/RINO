# Placeholder encoder partial — not actually used when backbone_config is set.
# Hydra still requires the encoder field to be valid, so we keep backbone_small
# as the default. The JTE adapter overrides self.encoder in Bert.__init__.
_target_: mattstools.mattstools.transformers.FullTransformerEncoder
_partial_: True
node_embd_config: &densenet
    num_blocks: 1
    hddn_dim: 256
    nrm: layer
    act_h: lrlu
edge_embd_config: *densenet
te_config:
  model_dim: &dim 256
  num_layers: &n_layers 4
  mha_config: &mha
    num_heads: 8
    drp: 0.1
    init_zeros: True
    do_layer_norm: True
  dense_config: &zeronet
    <<: *densenet
    output_init_zeros: True
outp_embd_config: *densenet
