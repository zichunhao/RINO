# @package _global_

defaults:
  - hydra: default.yaml
  - paths: default.yaml
  - _self_

project_name: mpm
network_name: mpm
ckpt_flag: last.ckpt
# ckpt_flag: best.ckpt

# Override test split to the QCDTTbar combined file
datamodule:
  test_set:
    path: ${paths.root_dir}/../../data/JetClass/mpm/test_20M_combined_QCDTTbar.h5

# k-NN probe config (QCD=0 vs TTbar hadronic=8)
knn:
  k_list: [1, 5, 10, 20, 100]
  labels_to_include: [0, 8]
  sample_size: 200000
  n_experiments: 10

# Linear probe config
linear_probe:
  labels_to_include: [0, 8]
  n_experiments: 10
  max_epochs: 100
  learning_rate: 1.0e-3
  batch_size: 2048
  sample_size: -1
  patience: 15
  val_fraction: 0.1
